name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:security
      - run: npm run test:device
      - run: npm run test:monitor
      - run: npm run test:memory-cleanup
      - run: npm run test:cosmetics
      - run: npm run test:resources
      - run: node tools/low-memory-mode-test.cjs
      - run: node linux/build.cjs
      - run: node linux/dist/runtime.test.cjs
      - run: node linux/dist/auth-timeout.test.cjs
