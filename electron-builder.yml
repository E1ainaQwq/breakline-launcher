# electron-builder 打包配置（Windows 安装程序）
#
# 为什么用 nsis 而不是 portable：
#   启动器要写入 %APPDATA%（同意状态、登录令牌、运行目录里的 authlib-injector.jar），
#   安装版有稳定的安装位置与卸载入口，玩家也更容易找回来。
#
# 注意：
#   1. 未做代码签名 ⇒ 首次运行会弹 SmartScreen 警告。内部使用可接受；正式分发要买证书。
#   2. `config/` 走 extraResources 放到 resources/ 下（不是 asar 内），
#      主进程用 configDir() 分环境解析（见 src/main/index.ts 的注释）。
#   3. **改名安全**：品牌名（productName / 快捷方式 / 安装包名）可以随便改，
#      玩家的数据目录跟的是 package.json 的 `name`（delta-launcher），
#      2026-09-17 改名前用 `--selftest` 核过打包版确实是 `%APPDATA%\delta-launcher`，
#      所以改名不会清掉同意记录、设置与头像缓存。要动 `name` 则必须做迁移。
appId: cn.delta.launcher
productName: Breakline Launcher
copyright: 断界行动 Breakline

directories:
  output: dist
  buildResources: build

# asar 内放构建产物；配置文件**同时**走 extraResources 与 asar 两份（见下）
files:
  # Only ship the application outputs. Other out/ children are local diagnostics,
  # captured user profiles and test game installations, never distributable data.
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  # 2026-09-19：启动模板**双份**。extraResources 只有一份，被杀软误删 / 更新换包只换一半时，
  # 症状就是"缺少 config/launch.json（启动模板）"且无法启动（运维实机遇到）。
  # asar 里再放一份 ⇒ readProfile() 的第二候选能兜住，玩家不必重下整个启动器。
  - config/**/*
  - package.json
  - '!**/*.map'

extraResources:
  - from: config
    to: config
    filter: ['**/*']
  # 启动动画素材（"反作弊启动中"面板上面那块视频）。
  # ⚠️ 必须走 extraResources：`file://` 加载视频时 asar **不是**普通文件系统路径，
  # Chromium 读不到（与托盘图标同一个坑，见下）。放这儿 = 打包后仍在真实目录里。
  # 目录里当前只有 README（没有 mp4）⇒ 目录非空、包里带上无副作用；玩家把
  # ac-startup.mp4 丢进 `%APPDATA%\delta-launcher\media\` 即可覆盖，不必重新打包。
  - from: resources/media
    to: media
    filter: ['**/*']
  # 托盘图标要走 extraResources：asar 里的文件 `nativeImage.createFromPath` 读不到
  # （它不是普通文件系统路径）。**托盘图标读不到时 Electron 不报错、只是没有图标** ——
  # 那种"功能在、但用户看不见入口"的故障最难发现，所以宁可单独放出来。
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png
  - from: resources/memory-cleanup-helper.exe
    to: memory-cleanup-helper.exe

win:
  target:
    # 2026-09-18 运维要求「以后只保留免安装版」⇒ 默认只出 portable。
    # NSIS 安装版仍可手动构建（npm run dist:nsis），仅作应急出口，正常不再发布。
    - portable
  icon: build/icon.ico
  artifactName: BreaklineLauncher-${version}-setup.${ext}

# 免安装单文件版（2026-09-18 运维要求："做成一个 exe 的免安装集成版"）。
# ⚠️ 两个目标**都发**：安装版保住自动更新（electron-updater 的 NSIS 通道），
#    免安装版给不想装的人。portable 是自解压包：运行时解到 %TEMP% 再启动，
#    所以首启慢一点（约 1–3 秒）；而数据仍然写在 %APPDATA%\delta-launcher
#    ⇒ 两种版本共用同一份登录/同意记录，来回切换不用重新登录。
# ⚠️ **免安装版不能沿用 NSIS 自动更新**：那条路会去跑 NSIS 安装包，
#    等于在玩家机器上又装一份。这一版先如实标注（见 App.tsx 的更新面板），
#    下一版再做"下载新版 exe → 放在旁边 → 自替换重启"。
portable:
  artifactName: BreaklineLauncher-${version}-portable.${ext}
  requestExecutionLevel: user
  # Each invocation owns its extraction directory. A duplicate rejected by
  # Electron's single-instance lock must not delete the running app's resources.
  unpackDirName: true

linux:
  maintainer: Breakline Team
  category: Game
  target:
    - deb
  artifactName: BreaklineLauncher-${version}-${arch}.${ext}

# 自身更新的"发布声明"。**必须配**，否则不产出 latest.yml：
#   electron-updater 判断"有没有新版本"靠的就是 latest.yml（不是猜文件名），
#   没有它时启动器会一直显示"已是最新"，而那是**看起来正常的空转**。
#
# `provider: generic` + 空 url = "只生成 latest.yml，不上传"。
# 真正的地址由 `config/launch.json` 的 `launcherUpdate.feedUrl` 在运行时给
# （electron-updater 的 setFeedURL 会覆盖它）。这样：
#   - 打包机不需要任何云端凭据（CI 友好）
#   - 换托管地址只改一个配置字段，**不用重新发版**
publish:
  - provider: generic
    url: ''
    channel: latest

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 断界行动
  deleteAppDataOnUninstall: false # 卸载不删登录令牌与同意记录，重装后不用重新登录
